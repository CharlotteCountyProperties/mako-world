<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mako's World</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1a1a22;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      touch-action: none;
      -ms-touch-action: none;
      overscroll-behavior: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: #1a1a22;
    }
    #game {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #game canvas {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #touch-strip {
      display: none;
      flex: 0 0 auto;
      box-sizing: border-box;
      height: 128px;
      padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px));
      background: #12121a;
      align-items: center;
      justify-content: space-between;
      touch-action: none;
      user-select: none;
    }
    #app.touch-play #touch-strip {
      display: flex;
    }
    @media (orientation: landscape) and (max-height: 520px) {
      #app.touch-play #touch-strip {
        height: 88px;
        padding: 6px 20px calc(6px + env(safe-area-inset-bottom, 0px));
      }
      #touch-strip button {
        width: 72px;
        height: 72px;
      }
    }
    .touch-cluster {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #touch-strip button {
      width: 88px;
      height: 88px;
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: rgba(244, 247, 251, 0.78);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.4);
      color: #1a1a22;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #touch-strip button.pressed {
      background: rgba(255, 255, 255, 0.95);
    }
    #btn-left::after,
    #btn-right::after,
    #btn-jump::after {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
    }
    #btn-left::after {
      width: 0;
      height: 0;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-right: 22px solid #1a1a22;
      transform: translateX(-2px);
    }
    #btn-right::after {
      width: 0;
      height: 0;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-left: 22px solid #1a1a22;
      transform: translateX(2px);
    }
    #btn-jump::after {
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-bottom: 22px solid #1a1a22;
      transform: translateY(-3px);
    }
  </style>
  <script src="lib/phaser.min.js"></script>
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <div id="touch-strip" aria-hidden="true">
      <div class="touch-cluster">
        <button type="button" id="btn-left" aria-label="Move left"></button>
        <button type="button" id="btn-right" aria-label="Move right"></button>
      </div>
      <div class="touch-cluster">
        <button type="button" id="btn-jump" aria-label="Jump"></button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      window.__makoTouch = { left: false, right: false, jump: false };

      function detectTouchPlay() {
        var coarse = false;
        var fine = false;
        try {
          coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
          fine = !!(window.matchMedia && window.matchMedia("(pointer: fine)").matches);
        } catch (err) {
          // ignore
        }
        var touch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
        return coarse || (touch && !fine);
      }

      window.applyMakoLayout = function () {
        var on = detectTouchPlay();
        var app = document.getElementById("app");
        var strip = document.getElementById("touch-strip");
        if (app) {
          if (on) {
            app.classList.add("touch-play");
          } else {
            app.classList.remove("touch-play");
          }
        }
        if (strip) {
          strip.setAttribute("aria-hidden", on ? "false" : "true");
        }
        if (window.game && window.game.canvas && window.game.scale && typeof window.game.scale.refresh === "function") {
          window.game.scale.refresh();
        }
        return on;
      };

      function setFlag(name, on) {
        window.__makoTouch[name] = !!on;
        var scene = window.game && window.game.scene &&
          (window.game.scene.getScene("main") || (window.game.scene.scenes && window.game.scene.scenes[0]));
        if (scene) {
          if (name === "left") {
            scene.touchLeft = !!on;
          } else if (name === "right") {
            scene.touchRight = !!on;
          } else if (name === "jump") {
            scene.touchJump = !!on;
          }
        }
      }

      function bind(id, name) {
        var el = document.getElementById(id);
        if (!el) {
          return;
        }
        var press = function (e) {
          if (e && e.preventDefault) {
            e.preventDefault();
          }
          setFlag(name, true);
          el.classList.add("pressed");
        };
        var release = function (e) {
          if (e && e.preventDefault) {
            e.preventDefault();
          }
          setFlag(name, false);
          el.classList.remove("pressed");
        };
        el.addEventListener("pointerdown", press);
        el.addEventListener("pointerup", release);
        el.addEventListener("pointerleave", release);
        el.addEventListener("pointercancel", release);
        el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      }

      bind("btn-left", "left");
      bind("btn-right", "right");
      bind("btn-jump", "jump");

      window.addEventListener("resize", window.applyMakoLayout);
      window.addEventListener("orientationchange", function () {
        window.setTimeout(window.applyMakoLayout, 60);
      });
      window.applyMakoLayout();
    })();
  </script>
  <script src="game.js"></script>
</body>
</html>
